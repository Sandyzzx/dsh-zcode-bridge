# dsh bundle patch: register the Bridge MCP server with the shipped dsh-mcp-client.
#
# install_bundle copies/links this bundle into the profile's node_modules, so
# the server path is resolved from the profileContext service (present in
# every profile-launched Harness; shipped configs use the same !!js pattern).
# The expression throws a clear error instead of spawning a broken path when
# no profile is available. `failOnStartupError: true` makes a Bridge that
# cannot start reject activation instead of registering an empty tool set.
#
# Tools appear to the model as mcp__zcode_bridge__zcode_task and siblings.
- insert:
    - id: zcode-bridge-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: zcode_bridge
        transport: stdio
        # The harness's own Node executable (absolute path): avoids PATH
        # resolution for the stdio child, which failed on some launches.
        command: !!js process.execPath
        args:
          - !!js '((ctx && ctx.get("profileContext") && ctx.get("profileContext").dir) || process.env.DSH_PROFILE_DIR || (() => { throw new Error("dsh-zcode-bridge requires a profile-launched Harness: profileContext and DSH_PROFILE_DIR are both unavailable") })()) + "/node_modules/dsh-zcode-bridge/server/bridge.mjs"'
        env:
          ZCODE_BRIDGE_PLUGIN_MODE: "1"
        failOnStartupError: true
